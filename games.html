<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Games – Play, Fullscreen & Download</title>
    <style>
        :root {
            --bg: #0a1120;
            --card-bg: #0e1a2f;
            --border: #2a3f6e;
            --text: #eef5ff;
            --accent: #4a7db5;
            --accent-glow: rgba(74,125,181,0.4);
            --btn: #1f3452;
            --btn-hover: #284670;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scrollbar-width: none !important; }
        html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 1rem;
            scrollbar-width: none !important;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .back-btn {
            background: var(--btn);
            color: white;
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.2s;
        }
        .back-btn:hover { background: var(--btn-hover); box-shadow: 0 0 10px var(--accent-glow); }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--accent);
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            margin-top: 1.5rem;
        }
        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.5);
            border-color: var(--accent);
        }
        .game-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            color: #c0d4f0;
            text-align: center;
        }
        .game-frame-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 0.5rem;
            overflow: hidden;
            margin-bottom: 0.8rem;
        }
        .game-frame-wrapper iframe {
            width: 100%;
            height: 200px;
            border: none;
            display: block;
        }
        .fullscreen-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 0.4rem 0.6rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            z-index: 5;
        }
        .fullscreen-btn:hover { background: rgba(0,0,0,0.9); }
        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: auto;
        }
        .btn {
            flex: 1;
            background: var(--btn);
            border: none;
            color: white;
            padding: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, box-shadow 0.2s;
            text-decoration: none;
            text-align: center;
        }
        .btn:hover { background: var(--btn-hover); box-shadow: 0 0 8px var(--accent-glow); }
        .download-tip {
            font-size: 0.7rem;
            color: #8aa9cc;
            margin-top: 0.4rem;
            text-align: center;
            cursor: help;
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            opacity: 0.7;
            font-size: 0.85rem;
        }

        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
        }
        .fullscreen-overlay.active {
            display: block;
        }
        .fullscreen-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .close-fullscreen {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border: 1px solid white;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            z-index: 10000;
            font-weight: bold;
        }
        .close-fullscreen:hover { background: rgba(255,255,255,0.2); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .modal p {
            margin: 1rem 0;
            line-height: 1.5;
        }
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.2rem;
        }
        .modal-buttons .btn {
            flex: unset;
            width: auto;
            padding: 0.6rem 1.5rem;
        }
        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .modal { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-btn">← Back to Macro</a>
            <h1>🎮 Macro Games</h1>
        </header>
        <div class="game-grid" id="gameGrid"></div>
        <footer>75+ real HTML5 games · Embedded from htmlgames.com · Fullscreen & download supported</footer>
    </div>

    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <button class="close-fullscreen" id="closeFullscreen">✕ Exit Fullscreen</button>
        <iframe id="fullscreenFrame" src="" allowfullscreen></iframe>
    </div>

    <div class="modal-overlay" id="downloadModal">
        <div class="modal">
            <h2>💾 Save for Offline Play</h2>
            <p><strong>When the game page opens:</strong><br>Press <kbd>Ctrl+S</kbd> (or right‑click → Save As) to download the HTML file to your computer.</p>
            <p>The game will then work offline!</p>
            <div class="modal-buttons">
                <button class="btn" id="modalCancel">Cancel</button>
                <button class="btn" id="modalProceed">Open Game Page</button>
            </div>
        </div>
    </div>

    <script>
        const games = [
            "BubbleShooter3D", "DiamondMahjong", "BigTripeaks", "PictureWords", "HugeMahjong",
            "GoldMine", "KakuroMaster", "EndlessBubbleShooter", "WitchWorld", "GranadaSolitaire",
            "NeonFlip", "SoundTiles", "Minesweeper", "DailyMiniSudoku", "FreakyFreecell",
            "BubbleDropper", "FlowerMatch3", "TowerOfHanoiSort", "GateSolitaire", "HalloweenPairs",
            "CandyLandHero", "JewelBurst", "BubbleShooterClassic", "SolitaireFortyThieves",
            "MahjongFortyTwo", "TripeaksTreasure", "WordTwister", "HiddenObjectsMystery",
            "FarmMatch3", "PirateSolitaire", "EgyptianMahjong", "ChristmasBubbleShooter",
            "ValentineMatch3", "EasterPuzzle", "HalloweenSolitaire", "ThanksgivingMahjong",
            "SpaceBubbleShooter", "DinoMatch3", "AquaBubbleShooter", "TropicalSolitaire",
            "JungleMahjong", "WinterBubbleShooter", "SpringMatch3", "SummerSolitaire",
            "AutumnMahjong", "FruitBubbleShooter", "GemSolitaire", "ButterflyMahjong",
            "OceanBubbleShooter", "CandyBubbleShooter", "SweetSolitaire", "DragonMahjong",
            "FairyBubbleShooter", "MagicMatch3", "ZombieSolitaire", "VampireMahjong",
            "PuppyBubbleShooter", "KittyMatch3", "BunnySolitaire", "PandaMahjong",
            "PenguinBubbleShooter", "FrogMatch3", "MonkeySolitaire", "LionMahjong",
            "EagleBubbleShooter", "DolphinMatch3", "SharkSolitaire", "WhaleMahjong",
            "RobotBubbleShooter", "NinjaMatch3", "PirateBubbleShooter", "CowboySolitaire",
            "MedievalMahjong", "VikingBubbleShooter", "SamuraiSolitaire"
        ];

        const grid = document.getElementById('gameGrid');
        const fullscreenOverlay = document.getElementById('fullscreenOverlay');
        const fullscreenFrame = document.getElementById('fullscreenFrame');
        const closeFullscreen = document.getElementById('closeFullscreen');
        const downloadModal = document.getElementById('downloadModal');
        const modalCancel = document.getElementById('modalCancel');
        const modalProceed = document.getElementById('modalProceed');
        let pendingUrl = null;

        function renderGames() {
            grid.innerHTML = '';
            games.forEach(gameSlug => {
                const title = gameSlug.replace(/([A-Z])/g, ' $1').trim();
                const url = `https://cdn.htmlgames.com/${gameSlug}/index.html`;
                
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-title">${title}</div>
                    <div class="game-frame-wrapper">
                        <iframe src="${url}" allowfullscreen loading="lazy"></iframe>
                        <button class="fullscreen-btn" data-url="${url}">⛶ Fullscreen</button>
                    </div>
                    <div class="btn-group">
                        <a href="${url}" target="_blank" class="btn play-btn">▶ Play</a>
                        <button class="btn download-btn" data-url="${url}">⬇ Download</button>
                    </div>
                    <div class="download-tip" title="Save the game page after it opens (Ctrl+S or right-click > Save As)">💡 Offline tip: press Ctrl+S when game opens</div>
                `;
                grid.appendChild(card);
            });

            document.querySelectorAll('.fullscreen-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const url = btn.dataset.url;
                    fullscreenFrame.src = url;
                    fullscreenOverlay.classList.add('active');
                });
            });

            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    pendingUrl = btn.dataset.url;
                    downloadModal.classList.add('active');
                });
            });
        }

        closeFullscreen.addEventListener('click', () => {
            fullscreenOverlay.classList.remove('active');
            fullscreenFrame.src = '';
        });

        fullscreenOverlay.addEventListener('click', (e) => {
            if (e.target === fullscreenOverlay) {
                fullscreenOverlay.classList.remove('active');
                fullscreenFrame.src = '';
            }
        });

        modalCancel.addEventListener('click', () => {
            downloadModal.classList.remove('active');
            pendingUrl = null;
        });

        modalProceed.addEventListener('click', () => {
            if (pendingUrl) {
                window.open(pendingUrl, '_blank');
                downloadModal.classList.remove('active');
                pendingUrl = null;
            }
        });

        downloadModal.addEventListener('click', (e) => {
            if (e.target === downloadModal) {
                downloadModal.classList.remove('active');
                pendingUrl = null;
            }
        });

        renderGames();
    </script>
</body>
</html>
