<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nations • Creamo</title>
  <!-- Globe.gl bundles Three.js -->
  <script src="https://unpkg.com/globe.gl@2.43.0/dist/globe.gl.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3"></script>
  <script src="./cities.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #map-container {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      scrollbar-width: none !important;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    body { background: #000; color: #fff; font-family: Inter, system-ui, sans-serif; }
    #map-container { position: relative; }
    #globe { position: absolute; inset: 0; }

    .panel {
      position: absolute;
      z-index: 40;
      left: 20px;
      bottom: 30px;
      width: min(370px, calc(100vw - 40px));
      padding: 18px 22px;
      background: #07101de8;
      border: 1px solid #ffd70066;
      border-radius: 18px;
      box-shadow: 0 15px 45px #000b;
      backdrop-filter: blur(14px);
      transform: translateY(15px);
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
    }
    .panel.show { transform: none; opacity: 1; pointer-events: auto; }
    .panel .type { font-size: 11px; letter-spacing: 1.5px; color: #ffd700; font-weight: 700; }
    .panel h2 { margin: 5px 0 8px; font-size: 24px; }
    .panel p { margin: 5px 0; color: #bbb; font-size: 13px; }
    .close {
      position: absolute;
      right: 12px;
      top: 10px;
      border: 0;
      background: none;
      color: #aaa;
      font-size: 24px;
      cursor: pointer;
    }

    .home {
      position: absolute;
      z-index: 30;
      right: 20px;
      top: 20px;
      width: 48px;
      height: 48px;
      border: 2px solid #ffd700;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #000a;
      text-decoration: none;
    }
    .home svg { width: 26px; height: 26px; fill: #ffd700; }

    .loading {
      position: absolute;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #02050a;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #ffffff18;
      border-top-color: #ffd700;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      position: absolute;
      z-index: 20;
      right: 20px;
      bottom: 100px;
      padding: 8px 14px;
      border: 1px solid #ffffff20;
      border-radius: 20px;
      background: #0009;
      color: #aaa;
      font-size: 12px;
      pointer-events: none;
    }

    .zoom-controls {
      position: absolute;
      bottom: 30px;
      right: 30px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 12px;
      padding: 15px 20px;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
    }
    .zoom-btn {
      padding: 8px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .zoom-btn:hover {
      background: rgba(255,215,0,0.2);
    }
    .zoom-btn.active {
      background: #ffd700;
      color: #000;
      border-color: #ffd700;
    }
    .zoom-warning {
      font-size: 12px;
      color: #ffcc00;
      max-width: 200px;
      line-height: 1.4;
      margin-top: 5px;
      display: none;
    }
    .zoom-warning.show {
      display: block;
    }
  </style>
</head>
<body>
<div id="map-container">
  <div id="globe"></div>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div id="loadingText">Building 3D Earth…</div>
  </div>

  <div id="panel" class="panel">
    <button class="close" id="close">×</button>
    <div class="type" id="panelType">COUNTRY</div>
    <h2 id="panelName">Select a country</h2>
    <p id="panelDetails">Click any country on the globe.</p>
  </div>

  <div class="hint">Click a country to see its name</div>

  <a class="home" href="../index.html" title="Back to Creamo">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
  </a>

  <!-- Resolution Controls -->
  <div class="zoom-controls">
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="zoom-btn active" id="res-50m">50m</button>
      <button class="zoom-btn" id="res-110m">110m</button>
    </div>
    <div class="zoom-warning" id="zoom-warning">⚠️ Small countries might not appear at this resolution.</div>
  </div>
</div>

<script>
  (() => {
    'use strict';

    const $ = id => document.getElementById(id);
    const globeEl = $('globe');
    const loading = $('loading');
    const loadingText = $('loadingText');

    let globe, countries = [], cities = [];
    let selected = null, hovered = null;
    let currentResolution = '50m'; // '50m' or '110m'

    const defaultColor = '#1a3c8b';

    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
    );

    // ---- polygon styling ----
    function cap(d) {
      if (selected && selected === d) return '#ffd700bb';
      if (hovered && hovered === d) return '#ffffff88';
      return defaultColor + '77';
    }

    function stroke(d) {
      if (selected && selected === d) return '#ffd700';
      if (hovered && hovered === d) return '#ffffff';
      return '#ffffffdd';
    }

    function refreshPolygons() {
      if (globe) {
        globe.polygonCapColor(cap);
        globe.polygonStrokeColor(stroke);
        globe.polygonsData(countries);
      }
    }

    function showPanel(name, details) {
      const panel = $('panel');
      const panelType = $('panelType');
      const panelName = $('panelName');
      const panelDetails = $('panelDetails');
      panelType.textContent = 'COUNTRY';
      panelName.textContent = name;
      panelDetails.textContent = details || 'Click any country.';
      panel.classList.add('show');
    }

    function hidePanel() {
      $('panel').classList.remove('show');
      selected = null;
      refreshPolygons();
    }

    function onPolygonClick(d) {
      selected = d;
      showPanel(d.name, 'Population: data not loaded');
      refreshPolygons();
    }

    function onPolygonHover(d) {
      hovered = d;
      document.body.style.cursor = d ? 'pointer' : 'default';
      refreshPolygons();
    }

    // ---- load countries based on resolution ----
    async function loadCountries(resolution) {
      const url = `https://cdn.jsdelivr.net/npm/world-atlas@2/countries-${resolution}.json`;
      try {
        loadingText.textContent = `Loading ${resolution} resolution borders…`;
        const res = await fetch(url, { cache: 'force-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status} for ${resolution}`);
        const world = await res.json();
        const features = topojson.feature(world, world.objects.countries).features;

        countries = features.map((feature, i) => {
          let pts = [];
          (function walk(x) {
            if (Array.isArray(x)) {
              if (typeof x[0] === 'number') pts.push(x);
              else x.forEach(walk);
            }
          })(feature.geometry.coordinates);
          const lng = pts.reduce((s, p) => s + p[0], 0) / (pts.length || 1);
          const lat = pts.reduce((s, p) => s + p[1], 0) / (pts.length || 1);
          return {
            geometry: feature.geometry,
            name: feature.properties?.name || feature.properties?.NAME || 'Country ' + (i + 1),
            lat, lng,
          };
        });

        if (globe) {
          globe.polygonsData(countries);
          refreshPolygons();
        }
        loading.style.display = 'none';
      } catch (e) {
        console.error('Failed to load borders:', e);
        loading.innerHTML = '<div style="font-size:42px">⚠️</div><div>' + esc(e.message || 'Failed to load borders.') + '</div><button onclick="loadCountries(currentResolution)">Retry</button>';
      }
    }

    // ---- initialize globe ----
    function initGlobe() {
      if (globe) return;

      globe = Globe()(globeEl)
        .backgroundColor('#00030a')
        .globeImageUrl('https://unpkg.com/three-globe@2.41.12/example/img/earth-blue-marble.jpg')
        .bumpImageUrl('https://unpkg.com/three-globe@2.41.12/example/img/earth-topology.png')
        .showAtmosphere(true)
        .atmosphereColor('#4da3ff')
        .atmosphereAltitude(0.16)
        .polygonCapColor(cap)
        .polygonSideColor(() => '#102040')
        .polygonStrokeColor(stroke)
        .polygonAltitude(0.008)
        .polygonLabel(d => `<b>${esc(d.name)}</b><br><small>Click to select</small>`)
        .onPolygonClick(onPolygonClick)
        .onPolygonHover(onPolygonHover);

      globe.controls().enableDamping = true;
      globe.controls().dampingFactor = 0.08;
      globe.pointOfView({ lat: 20, lng: 0, altitude: 2.35 });

      window.addEventListener('resize', () => {
        if (globe) globe.width(window.innerWidth).height(window.innerHeight);
      });

      // Load cities if available
      if (typeof cityData !== 'undefined' && Array.isArray(cityData)) {
        cities = cityData.map(c => ({
          name: String(c.name),
          country: c.country || c.countryName || '',
          lat: +c.lat, lon: +c.lon, pop: Number(c.pop) || 0
        })).filter(c => Number.isFinite(c.lat) && Number.isFinite(c.lon));
      }
    }

    // ---- main load ----
    async function load(resolution = '50m') {
      currentResolution = resolution;
      initGlobe();
      await loadCountries(resolution);
      // update active button
      document.querySelectorAll('.zoom-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`res-${resolution}`).classList.add('active');
      // warning
      const warning = document.getElementById('zoom-warning');
      if (resolution === '110m') {
        warning.classList.add('show');
      } else {
        warning.classList.remove('show');
      }
    }

    // ---- events ----
    $('close').onclick = hidePanel;

    document.addEventListener('click', (e) => {
      const panel = $('panel');
      if (panel.classList.contains('show') && !panel.contains(e.target) && !e.target.closest('#globe')) {
        // only close via X button
      }
    });

    // ---- resolution buttons ----
    document.getElementById('res-50m').addEventListener('click', () => load('50m'));
    document.getElementById('res-110m').addEventListener('click', () => load('110m'));

    // ---- start ----
    load('50m');
  })();
</script>
</body>
</html>
